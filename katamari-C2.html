<html>
<head>
<meta http-equiv="Content-Type" content="text/html;charset=utf-8" >
<title>WebGL Team Project: Katamari with WebGL</title>

<style>
    /* No margins and no scroll bars, so the canvas can cover the whole page */
    html, body { margin: 0; height: 100%; overflow: hidden; background-color: #888888; }
    /* display: block removes the small gap that appears under an inline canvas */
    #gl-canvas { display: block; width: 100%; height: 100%; }
    /* The text line sits on top of the game in the top-left corner */
    #controls { position: absolute; top: 8px; left: 8px; color: white; font-family: sans-serif; }
</style>

<script id="vertex-shader" type="x-shader/x-vertex">
    // Data of each vertex, coming from the Mesh buffers in JavaScript
    attribute vec4 aPosition;   // position (x, y, z, 1)
    attribute vec3 aNormal;     // unit normal, for lighting later (A1)
    attribute vec2 aTexCoord;   // texture coordinate, for textures later (A3)

    // Model-view and projection matrices (set from JavaScript for every object)
    uniform mat4 uModelView;
    uniform mat4 uProjection;

    // Varying variables to send the normal and texture coordinate to the fragment shader
    varying vec3 vNormal;
    varying vec2 vTexCoord;

    void main() {
        vNormal = aNormal;
        vTexCoord = aTexCoord;

        // Move the vertex: object -> camera -> clip coordinates.
        // The order matters, the matrix closest to aPosition is applied first.
        gl_Position = uProjection * uModelView * aPosition;
    }
</script>

<script id="fragment-shader" type="x-shader/x-fragment">
    // Set how many bits used for float values, it won't work otherwise
    precision mediump float;

    // Varying variables from the vertex shader
    varying vec3 vNormal;
    varying vec2 vTexCoord;

    void main() {
        // No lighting yet (Phase 7), so we show the normal as a color:
        // x -> red, y -> green, z -> blue. The normal is -1..1, so * 0.5 + 0.5 moves it to 0..1.
        // A correct sphere looks smooth with no seams, the plane is one light green.
        gl_FragColor = vec4(0.5 * normalize(vNormal) + 0.5, 1.0);
    }
</script>

<!-- Copyright (c) <2012-2015> Ed Angel and Dave Shreiner -->
<script type="text/javascript" src="common/webgl-utils.js"></script>
<script type="text/javascript" src="common/initShaders.js"></script>
<script type="text/javascript" src="common/MV.js"></script>
<!-- Copyright (c) <2012-2015> Ed Angel and Dave Shreiner -->

<!-- Our own classes, always before the main file that uses them -->
<script type="text/javascript" src="mesh.js"></script>
<script type="text/javascript" src="katamari-C2.js"></script>
</head>

<body>
    <!-- No width/height here: resizeCanvas() in katamari-C2.js sets them to the window size -->
    <canvas id="gl-canvas">
        Sorry ... your browser doesn't support the HTML5 canvas element.
    </canvas>
    <!-- Controls are added in Phase 5 (mouse) and Phase 6 (keyboard) -->
    <div id="controls">Katamari: ground plane and sphere</div>
</body>
</html>
