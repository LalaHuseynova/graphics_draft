<title>WebGL Team Project: Katamari with WebGL</title>

<style>
    html, body { margin: 0; height: 100%; overflow: hidden; background-color: #888888; }
    #gl-canvas { display: block; width: 100%; height: 100%; }
    #controls { position: absolute; top: 8px; left: 8px; color: white; font-family: sans-serif; }
</style>

<script id="vertex-shader" type="x-shader/x-vertex">
    
    // position (x, y, z, 1)
    attribute vec4 aPosition;
     
    // unit normal
    attribute vec3 aNormal;  

    // texture coordinate
    attribute vec2 aTexCoord; 

    // model-view and projection matrices
    uniform mat4 uModelView;
    uniform mat4 uProjection;

    varying vec3 vNormal;
    varying vec2 vTexCoord;

    void main() {
        vNormal = aNormal;
        vTexCoord = aTexCoord;

    // Move the vertex to clip space using the matrices from right to left.
        gl_Position = uProjection * uModelView * aPosition;
    }
</script>

<script id="fragment-shader" type="x-shader/x-fragment">
    // Set how many bits used for float values. Will not work otherwise.
    precision mediump float;

    // get data from the vertex shader
    varying vec3 vNormal;
    varying vec2 vTexCoord;

    void main() {
        // use normals as RGB colors until lighting is added
        // Convert normal values from [-1, 1] to [0, 1]
        gl_FragColor = vec4(0.5 * normalize(vNormal) + 0.5, 1.0);
    }
</script>
